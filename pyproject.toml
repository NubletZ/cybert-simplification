[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybert"
version = "0.1.0"
description = "CyBERT: knowledge-guided sentence simplification via POS-guided denoising and content-style disentanglement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "spacy>=3.7",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
eval = ["bert-score>=0.3.13", "thop>=0.1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
cybert = "cybert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
